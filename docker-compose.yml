services:
  postgres:
    image: postgres:16-alpine
    container_name: biweb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: biweb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M

  adminer:
    image: adminer
    container_name: biweb-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy

  collector:
    build:
      context: ./collector-node
      dockerfile: Dockerfile
    container_name: biweb-collector
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-password}@postgres:5432/biweb?sslmode=disable
      BILI_ACCESS_KEY_ID: ${BILI_ACCESS_KEY_ID}
      BILI_ACCESS_KEY_SECRET: ${BILI_ACCESS_KEY_SECRET}
      BILI_APP_ID: ${BILI_APP_ID}
      BILI_COOKIE_SECRET: ${BILI_COOKIE_SECRET:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
    volumes:
      - ./exports:/app/exports
    networks:
      - backend
      - frontend
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: biweb-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-password}@postgres:5432/biweb?schema=public
      SESSION_SECRET: ${SESSION_SECRET}
      BILI_COOKIE_SECRET: ${BILI_COOKIE_SECRET:-}
    networks:
      - frontend
      - backend
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true

volumes:
  postgres_data:
